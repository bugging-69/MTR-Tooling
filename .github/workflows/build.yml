name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Code signing environment variables
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Prepare certificate for signing (if available)
      - name: Prepare signing certificate
        if: secrets.CSC_LINK_BASE64 != null
        shell: pwsh
        run: |
          $certPath = "$env:RUNNER_TEMP\codesign.pfx"
          $certBase64 = "${{ secrets.CSC_LINK_BASE64 }}"
          
          if ($certBase64) {
            [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($certBase64))
            Write-Host "✅ Certificate prepared at: $certPath"
            echo "CSC_LINK=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - run: npm run electron:build

      # Verify signatures on installer
      - name: Verify installer signature
        if: secrets.CSC_LINK_BASE64 != null
        shell: pwsh
        run: |
          $installerPath = Get-ChildItem -Path "release" -Filter "*.exe" -Recurse | Select-Object -First 1
          
          if ($installerPath) {
            Write-Host "🔍 Verifying signature: $($installerPath.Name)"
            $signature = Get-AuthenticodeSignature -FilePath $installerPath.FullName
            
            Write-Host "   Status: $($signature.Status)"
            Write-Host "   Signer: $($signature.SignerCertificate.Subject)"
            Write-Host "   Thumbprint: $($signature.SignerCertificate.Thumbprint)"
            Write-Host "   Timestamp: $($signature.TimeStamperCertificate -ne $null)"
            
            if ($signature.Status -ne "Valid") {
              Write-Error "❌ Installer signature is invalid: $($signature.Status)"
              exit 1
            }
            Write-Host "✅ Installer signature is valid"
          } else {
            Write-Error "❌ No installer found in release directory"
            exit 1
          }

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            release/**/*.exe

      # Clean up certificate
      - name: Clean up certificate
        if: always()
        shell: pwsh
        run: |
          $certPath = "$env:RUNNER_TEMP\codesign.pfx"
          if (Test-Path $certPath) {
            Remove-Item $certPath -Force
            Write-Host "✅ Certificate cleaned up"
          }

